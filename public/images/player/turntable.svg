<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <!-- original turntable illustration for the sidebar record player (light wood to match the shelf) -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead6b6"/>
      <stop offset="1" stop-color="#d2b48c"/>
    </linearGradient>
    <linearGradient id="woodEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39d6c"/>
      <stop offset="1" stop-color="#a98457"/>
    </linearGradient>
    <radialGradient id="platter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#111"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
  </defs>
  <!-- plinth: wooden top with a darker front edge and a soft shadow -->
  <rect x="3" y="7" width="154" height="110" rx="9" fill="#000" opacity=".12"/>
  <rect x="2" y="2" width="156" height="110" rx="9" fill="url(#woodEdge)"/>
  <rect x="2" y="2" width="156" height="104" rx="9" fill="url(#wood)"/>
  <path d="M12 14 H148 M12 40 H148 M12 70 H148 M12 94 H148" stroke="#c9a87c" stroke-width=".6" opacity=".5"/>
  <!-- platter + mat -->
  <circle cx="62" cy="55" r="49" fill="#1a1a1a"/>
  <circle cx="62" cy="55" r="47" fill="url(#platter)"/>
  <circle cx="62" cy="55" r="40" fill="none" stroke="#3a3a3a" stroke-width=".8"/>
  <circle cx="62" cy="55" r="32" fill="none" stroke="#3a3a3a" stroke-width=".8"/>
  <circle cx="62" cy="55" r="24" fill="none" stroke="#3a3a3a" stroke-width=".8"/>
  <circle cx="62" cy="55" r="2.4" fill="url(#metal)"/>
  <!-- tone arm: pivot base, counterweight, arm, headshell, rest post -->
  <circle cx="136" cy="24" r="11" fill="#d8d8d8" stroke="#9d9d9d" stroke-width="1"/>
  <circle cx="136" cy="24" r="6" fill="url(#metal)" stroke="#8a8a8a" stroke-width=".8"/>
  <rect x="133" y="6" width="6" height="9" rx="2" fill="#555"/>
  <path d="M136 24 L136 70 L118 92" fill="none" stroke="url(#metal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136 24 L136 70 L118 92" fill="none" stroke="#8a8a8a" stroke-width=".6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="110" y="88" width="13" height="7" rx="1.5" transform="rotate(-50 116.5 91.5)" fill="#444"/>
  <circle cx="146" cy="80" r="3" fill="#bbb" stroke="#888" stroke-width=".6"/>
  <!-- start/stop knob and speed buttons -->
  <circle cx="16" cy="98" r="6" fill="url(#metal)" stroke="#8a8a8a" stroke-width=".8"/>
  <rect x="128" y="98" width="9" height="4" rx="1" fill="#c7c7c7" stroke="#8a8a8a" stroke-width=".5"/>
  <rect x="140" y="98" width="9" height="4" rx="1" fill="#c7c7c7" stroke="#8a8a8a" stroke-width=".5"/>
</svg>
